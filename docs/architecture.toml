# Architecture model for the "diagrams as tests" guardrail.
#
# Single source of truth for:
#   - the generated component diagram + per-component pages
#   - which modules are scanned for the domain class diagram
#   - the architecture metrics snapshot and its hard budgets
#
# The directional layering contract lives in pyproject.toml
# ([tool.importlinter]); the tiers below document that intent (dependencies must
# only point downward, Entrypoints -> Core -> Foundation) and group the diagram.
#
# `component_of()` matches a module to a component by LONGEST module-prefix, so
# "lithos_loom.plugins" also captures "lithos_loom.plugins.story_develop" etc.
#
# This project uses the portable guardrail kit (tests/guardrail/ + scripts/) with
# only the core views enabled. The kit's two optional adapters — [tool_catalog]
# (a decorator-registered MCP tool surface) and [containers] (on-disk data
# stores) — are omitted: lithos-loom is an MCP client (its CLI is Typer, not an
# MCP tool surface) and its on-disk state is a per-run directory tree with no
# central store-config class to anchor a container view to.

[project]
root_package = "lithos_loom"
src_layout   = "src"

# One-line description per component, shown at the top of its drill-down page
# (docs/generated/components/<Component>.md). test_component_pages requires one
# for every component in [components].
[component_docs]
Entrypoint     = "Typer CLI app entry and `python -m` bootstrap (`lithos-loom = lithos_loom.main:app`)."
Children       = "Child-process entrypoints spawned by the supervisor (watcher / sync child mains)."
Cli            = "Typer command implementations (task, project, develop, review, obsidian-sync, …)."
Plugins        = "Bundled subprocess plugins; the mature one is story_develop (the implement→review→fix cycle)."
Subscriptions  = "Event-subscription handlers and route-runner projection (route runner, awaiting-review, Obsidian projection)."
Sources        = "Event/issue producers: Lithos SSE event & note streams, GitHub issue watcher, Obsidian watchers."
Render         = "Rendering of tasks and notes into Obsidian-Tasks-compatible markdown."
Doctor         = "Environment and configuration diagnostics (`doctor` CLI)."
Evals          = "The review-eval harness (case / harness / match / judge / patch / stats and its own CLI)."
Bus            = "In-process async event bus."
Config         = "TOML config discovery/loading and the config dataclasses (LoomConfig, OrchestratorConfig, …)."
Errors         = "Shared exception hierarchy (LithosLoomError and friends)."
LithosClient   = "Async MCP-over-SSE client to the Lithos server (task/note CRUD, event stream, dead-session recovery)."
GitHub         = "gh / GitHub API client and its data types (Issue, PullRequest, GitHubClient)."
Tasks          = "Task-creation planning and parsing of Obsidian-Tasks task lines."
Notifications  = "Push sinks for loom-raised needs-human gates (desktop toast, GitHub @mention, operator command)."
State          = "Durable host-side hot state: the SSE cursor JSON store and projection sync state."
Runners        = "Route and plugin execution (worktree, git, agent detection, subprocess plugin runner)."
Supervisor     = "Long-lived child-process supervisor (spawn / monitor / restart by category)."
ProjectContext = "Bidirectional project-context doc projection between Lithos and Obsidian."

[components]
Entrypoint     = ["lithos_loom.main", "lithos_loom.__main__"]
Children       = ["lithos_loom.children"]
Cli            = ["lithos_loom.cli"]
Plugins        = ["lithos_loom.plugins"]
Subscriptions  = ["lithos_loom.subscriptions"]
Sources        = ["lithos_loom.sources"]
Render         = ["lithos_loom.render"]
Doctor         = ["lithos_loom.doctor"]
Evals          = ["lithos_loom.evals"]
Bus            = ["lithos_loom.bus"]
Config         = ["lithos_loom.config"]
Errors         = ["lithos_loom.errors"]
LithosClient   = ["lithos_loom.lithos_client", "lithos_loom.lithos_types"]
GitHub         = ["lithos_loom.github_approval", "lithos_loom.github_client", "lithos_loom.github_models", "lithos_loom.github_review_activity", "lithos_loom.github_review_streams"]
Tasks          = ["lithos_loom.task_graph", "lithos_loom.task_line_parser", "lithos_loom.task_line", "lithos_loom.gates"]
Notifications  = ["lithos_loom.notifications"]
State          = ["lithos_loom.cursor_store", "lithos_loom.sync_state"]
Runners        = ["lithos_loom.runner", "lithos_loom.plugin_runner"]
Supervisor     = ["lithos_loom.supervisor"]
ProjectContext = ["lithos_loom.render_project_context"]

[tiers]
Entrypoints = ["Entrypoint", "Children"]
Core        = ["Cli", "Plugins", "Subscriptions", "Sources", "Render", "Doctor", "Evals"]
Foundation  = ["Bus", "Config", "Errors", "LithosClient", "GitHub", "Tasks", "Notifications", "State", "Runners", "Supervisor", "ProjectContext"]

# Hard architecture budgets, checked by tests/guardrail/test_metrics_budgets.py
# against the metrics snapshot (docs/generated/metrics.md explains each one).
# CI fails if a measured value exceeds its budget. Raising a budget is allowed
# but must be an explicit, reviewed edit to this file; lower a budget after
# improving the code to lock in the gain.
#
# Most budgets below are tight ratchets pinned at today's value (any regression
# fails CI). max_module_lines is the exception: it is a STOP-LOSS ceiling set a
# little above today's largest module so a big module can't quietly balloon — it
# is deliberately NOT pinned to the exact current high-water mark. Ratchet the
# *count* of oversized modules down via modules_over_800_lines instead.
[budgets]
cross_component_edges  = 71   # 65->68: b91177d2 notifications.py (Notifications) imported by Subscriptions + Children, and importing GitHub; 68->70: #407 slice 2a — the daemon entry (main) imports Runners for the boot-time orphan-container reap (the one place that runs before any child), and the develop CLI imports Runners for the SIGTERM-as-SystemExit install shared with the plugin entry (both run subprocess lifecycles the daemon terminates); direction: down; 70->71: #431 — the watcher's dispatchers publish a crashed child's last output line into a story's finding, so Subscriptions imports publish_text (Plugins) for the ONE neutraliser every publisher shares rather than copying its character class; same tier (Core -> Core), direction: sideways
component_cycles       = 1    # Render <-> Subscriptions; goal: 0
module_cycles          = 1    # agent_session <-> panel <-> rounds SCC; goal: 0
modules_over_800_lines = 11 # 8->6 via ARCH-9 slices 1-2; 6->7: rounds.py (821) gained the admitted
                               # no-change round (PR #396 review) — the round pipeline is one
                               # responsibility and its phases read best in one place, so the
                               # budget moves rather than the phases; 7->8: route_runner.py
                               # (802) gained the ADR 0012 forget-on-not-ready hook — six lines
                               # in the one dispatch path whose guards (decline, readiness,
                               # admission, claim) must read in order; no seam worth a module;
                               # 8->9: external_remediation.py (813, was exactly 800) records the
                               # failed outcome on its two no-verdict paths and clears the previous
                               # round's at the reservation (#408) — a dozen lines in the run's
                               # dispatch / crash / no-result tail; the writes live in remediation_outcome.py;
                               # 9->10: cli/_deliver_lithos.py (809, was 788) — the story read learned
                               # to tell this delivery's own dispatch hold from a foreign run by agent
                               # (converge f6babfd8 correctness/f-001; the rule is a docstring beside
                               # the filter it governs). The module is deliver's Lithos half — read the
                               # story, raise/adopt the pr gate, retire the human gates, post the finding
                               # — one responsibility read in order; the next change that grows it takes
                               # the gate step (gate_delivery + retirement) into its own module;
                               # HELD at 10 through PR #426: the weak approval floor grew three
                               # rounds of authorial-text rules (quotes, structural fences, HTML
                               # comments, value enumerations, soft wraps), which took
                               # github_models.py past 800 — so the approval vocabulary was
                               # EXTRACTED to github_approval.py (517 lines: the phrase
                               # vocabulary, the unit splitters, the masks and both classifiers),
                               # leaving github_models the payload models + parsers it says it is
                               # (552). github_models re-exports the two public names, as
                               # github_client re-exports the dataclasses; direction: down
                               # 10->11: cli/deliver.py (829, was 789) — the chained converge moved INSIDE the
                               # claimed phase (PR #427 review, Medium 1: it must run after the PR exists and
                               # before the pr gate, under the same claims), and the command tail became the
                               # exit-code rule; the step's body itself lives in _deliver_converge.py, the
                               # preflight refusals in _deliver_preflight.py — what remains is the one
                               # ordered sequence whose steps must read in order;
max_module_lines       = 2100 # stop-loss; 2210->2100 after PRD S6 extracted the wire
                               # types (Task / Note / … / WriteStatus) into lithos_types,
                               # taking lithos_client from 2228 to ~2030. The parsers are
                               # the next extraction if it climbs again — not a bump.
cross_module_private_refs = 8   # measured 2026-07; children._boot x3, story_develop seam constants; goal: 0
tests_private_imports     = 99  # 98->99: 5dbeb0c8 slice C — one `cli.develop._follow_state` call pins that the ATTACH label's round comes from the run's checkpoint (the `list` half of the same rule is asserted through the public `develop list --json`); attach's own public surface can only be driven to completion on a TERMINAL run, and the rule is about a live one. Direction: down.
                               # 97->98 (merge of PR #431 onto #429): PR #431 converge-push tests reach one cli private; 94->97: PR #429 review — test_story_develop_panel reaches panel._read_review / _prior_review_text to pin the bounded, symlink-refusing reads the reviewer asked for through the panel path (no public seam short of a live engine); 98->93: test_github_watcher_child's seven per-test _run_reconcile_pass imports consolidated to one; cli.develop helpers dominate;
                               # 93->94: `develop deliver`'s Lithos half split into the story/gate rules (_deliver_lithos) and the client sessions (_deliver_session) to keep
                               # modules_over_800_lines at 9; the fake client is patched where the session constructs it, as every other client test does;
                               # 94->95: `develop converge-push`'s read-only half (the run dir, the live PR read, the push verdict) is its own module for the same reason deliver's
                               # preflight is — the refusals read and test better apart from the sequence they guard — and its two gh seams are patched where that module calls them; direction: down

# Domain class diagram: the GitHub/task data types are the domain entities.
# Everything else (config/settings, plugin-internal working types, eval
# harness types, infra clients) is not a domain entity and is excluded so the
# always-on completeness gate (test_every_model_is_scanned_or_excluded) passes.
[domain]
include_modules = [
    "lithos_loom.github_client",
    "lithos_loom.github_models",
    "lithos_loom.github_review_activity",
    "lithos_loom.gates",
    "lithos_loom.task_graph",
    "lithos_loom.task_line_parser",
    "lithos_loom.supervisor",
]
exclude_modules = [
    "lithos_loom.github_review_streams",  # the stream registry: infrastructure, not an entity
    "lithos_loom.config",
    "lithos_loom.errors",
    "lithos_loom.plugins",
    "lithos_loom.evals",
    "lithos_loom.sources",
    "lithos_loom.subscriptions",
    "lithos_loom.runner",
    "lithos_loom.plugin_runner",
    "lithos_loom.render",
    "lithos_loom.render_project_context",
    "lithos_loom.lithos_client",
    "lithos_loom.lithos_types",
    "lithos_loom.cli",
    "lithos_loom.bus",
    "lithos_loom.doctor",
    "lithos_loom.children",
    "lithos_loom.cursor_store",
    "lithos_loom.sync_state",
    "lithos_loom.notifications",
]
