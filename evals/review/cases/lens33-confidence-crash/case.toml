[case]
id = "lens33-confidence-crash"
description = """
lens PR #33 escape (K1-S3, story-develop run 75d8ee2b): the standard panel
(correctness + security, 2 rounds, zero findings) AND the new approval-hold
artifact pass approved and delivered head 1d190ba with unvalidated frontmatter
confidence. _format_confidence documents confidence as a 0..1 fraction but
formats ANY numeric: out-of-range values render misleading chips (2 -> "200%"),
and non-finite values (`confidence: .nan` / `.inf` in frontmatter) pass the
isinstance guard and make round() raise (ValueError / OverflowError)
mid-render — crashing the whole /note/{id} page. Frontmatter is untrusted,
agent-written input; the module's own convention (malformed input -> no chip)
was applied to type errors but not to range/finiteness. Caught externally:
Copilot flagged the misleading-percentage form post-delivery; the fix round
exposed the page-crash form. Fixed in lens 87c9560 (range guard: not
0 <= value <= 1 -> no chip; comparison semantics reject NaN for free).

The two symptom forms are INDEPENDENTLY REMEDIABLE — math.isfinite() alone
prevents the crash but still renders "200%", and a `< 0 or > 1` check alone
rejects finite out-of-range values while NaN sails through (both comparisons
are False) — so they are two [[expected]] defects, same partial-catch
semantics as 289-symlink-artifacts: a finding naming only one form is a
partial catch; one comprehensive finding covering both satisfies both.

CROSS-REPO case: repo points at the sibling lithos-lens checkout. FULL-FEATURE
diff as the panel approved it (base = lens main a429e8e post-K1-S2; patch =
delivered head 1d190ba, pre-fix).

PAIRED (RH-1) with the authentic fix: known-good.patch is
`git diff a429e8e..87c9560`, and 87c9560 is the IMMEDIATE CHILD of the delivered
head — so the two arms differ by that fix and nothing else (a two-line guard, a
docstring, ten test lines, and the docs/generated metric drift the defect patch
already carries). The tightest pair in the benchmark; contrast 289, whose
known-good is a 16-file merged head. One comparison closes both forms:
`not 0 <= value <= 1` rejects finite out-of-range values, and NaN/inf fail it
for free (every comparison against NaN is False).

KNOWN-GOOD IS CLEAN ON THE MEASURED DEFECT ONLY — not globally. At 87c9560,
normalize_note() still drops the top-level raw["path"] (the CRITICAL namespace
bug two baseline samples filed) and access_scope is still counted in has_chips
unconditionally (a MAJOR shared-chip bug another sample filed). So expect this
case's `noise` / `blk` to run high: the panel finds real defects there. `fp` is
unaffected — it counts only known-good runs reporting THIS case's expected
defect (harness.py) — but "the known-good arm got no noisier" is a weak ship
criterion here; compare known_good_findings_per_sample arm-to-arm instead.
"""
ac_provenance = "replay"
tier = "frontier"       # discriminating at the 2026-08 baseline — headline signal
repo = "../lithos-lens"
base = "a429e8e952359011fdcdc039e24255ba1d77559b"
head_patch = "feature-with-defect.patch"
personas = ["correctness"]
profile = "standard"
acceptance_criteria_file = "ac.md"

[known_good]
head_patch = "known-good.patch"

[[expected]]
file = "src/lithos_lens/knowledge_metadata.py"
keywords = ["out-of-range", "out of range", "outside the documented", "misleading", "200%"]
min_severity = "minor"
mechanism = """
RANGE form (misleading rendering): _format_confidence documents confidence as
a 0..1 fraction but formats any finite numeric with round(value * 100) — a
FINITE value outside the documented range (confidence: 2, confidence: -0.5 in
untrusted agent-written frontmatter) renders a misleading chip ("200%",
"-50%") instead of following the module's malformed-input no-chip convention.
A finiteness-only guard (math.isfinite) does NOT fix this form — the finding
must identify that finite out-of-range values render nonsense.
"""

[[expected]]
file = "src/lithos_lens/knowledge_metadata.py"
keywords = ["nan", ".inf", "infinit", "non-finite", "crash", "overflow"]
min_severity = "major"
mechanism = """
NON-FINITE form (render crash): NaN / infinity pass the isinstance(int, float)
type guard, and round(value * 100) then raises (ValueError on NaN,
OverflowError on inf) inside template rendering — one malformed frontmatter
value (`confidence: .nan`) crashes the ENTIRE /note/{id} page. An ordinary
range comparison (`value < 0 or value > 1`) does NOT fix this form — both
comparisons are False for NaN — so the finding must identify the non-finite
crash specifically, not just out-of-range rendering.
"""
