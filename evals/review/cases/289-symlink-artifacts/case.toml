[case]
id = "289-symlink-artifacts"
description = """
PR #289 round-1 escape (external review, Critical): gate artifact collection —
a HOST-privileged copy of a directory out of each check's tree export into the
run handoff. The parser rejects textual absolute paths and '..', and the PR
claimed "traversal-safe" — but the copy itself followed symlinks in BOTH
directions: a repo/check-planted symlink inside the artifacts dir let the host
collector read outside the export, and because the destination lived in the
AGENT-WRITABLE handoff, an agent could pre-plant a symlink at the predictable
round/check path and redirect the host-privileged write onto host files (shell
config, credentials). Both directions were reproduced by the reviewer.

The two directions are SEPARATE trust-boundary failures (host reads out vs
agent-redirected host writes), so they are two [[expected]] defects: a finding
that names only one direction is a partial catch, not a full one. A single
comprehensive finding that covers both directions satisfies both.

FULL-FEATURE diff as originally pushed (base = pre-#289 main 78b650a; patch =
slice 1 at its first-push head 156a4a9). The security persona's target: textual
path validation is not filesystem-boundary enforcement, and host-side writes
into agent-writable directories cross the container trust boundary. Fixed in
#289 (host-controlled artifacts dir + RO nested mount + followlinks=False walk).
"""
ac_provenance = "synthetic"
repo = "."
base = "78b650a2ad649848978e1c47ec70633aff92d301"
head_patch = "feature-with-defect.patch"
personas = ["security"]
profile = "standard"
acceptance_criteria_file = "ac.md"

[[expected]]
file = "src/lithos_loom/plugins/story_develop/check_runner.py"
keywords = [
  "outside the export",
  "outside the exported",
  "outside the tree",
  "read outside",
  "reads outside",
  "exfiltrat",
]
min_severity = "critical"
mechanism = """
SOURCE-side symlink following (host reads out): _collect_check_artifacts runs
on the HOST and copies from the check's tree export (repo/check-controlled
content) using is_dir()/shutil.copytree with default symlink-following. A
symlink planted inside the artifacts dir — by the repo or by check execution —
makes the host-privileged copy READ files from outside the exported tree (host
dotfiles, credentials) and deposit them into the handoff, which is mounted into
agent containers: an exfiltration path from host to agent. The textual
absolute/'..' parser validation does not constrain this direction — path-string
validation is not filesystem-boundary enforcement.
"""

[[expected]]
file = "src/lithos_loom/plugins/story_develop/check_runner.py"
keywords = [
  "write through",
  "writes through",
  "pre-plant",
  "pre-create",
  "overwrite host",
  "clobber",
]
min_severity = "critical"
mechanism = """
DESTINATION-side symlink following (agent redirects host writes): the copy
destination lives in the handoff dir, which is mounted READ-WRITE into agent
containers — so the agent can pre-create the predictable round/check
destination path (or one of its parents) as a symlink before the host
collects. dest.mkdir(exist_ok=True) + copytree(dirs_exist_ok=True) then WRITE
THROUGH the planted symlink onto arbitrary host-user-writable files (shell
config, credentials): an agent-controlled write primitive on the host. This is
independent of the source-side read escape — catching one direction does not
cover the other.
"""
